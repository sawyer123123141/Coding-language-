[workspace]
resolver = "2"
exclude = ["godot", "bench/particles/rust"]
members = ["syntax", "check", "kir", "runtime", "window", "codegen", "driver", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
kestrel-syntax = { path = "syntax" }
kestrel-check = { path = "check" }
kestrel-kir = { path = "kir" }
kestrel-runtime = { path = "runtime" }
kestrel-window = { path = "window" }
kestrel-codegen = { path = "codegen" }
kestrel-driver = { path = "driver" }
cranelift-codegen = "0.116"
cranelift-frontend = "0.116"
cranelift-module = "0.116"
cranelift-jit = "0.116"
cranelift-object = "0.116"
cranelift-native = "0.116"
find-msvc-tools = "0.1.9"
cc = "1"
